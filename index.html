<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>La Chatte FC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Fige la hauteur réelle de l'app dans une variable CSS. iOS recalcule
      // mal 100dvh à l'ouverture/fermeture du clavier (bug connu) et peut
      // rester bloqué sur une valeur incorrecte : d'où cette mesure JS.
      //
      // Le piège de la version figée « une fois pour toutes » : si la mesure
      // initiale tombe au mauvais moment (rechargement déclenché pendant que
      // le clavier est ouvert, retour d'arrière-plan, mise à jour du service
      // worker), la hauteur reste trop courte pour TOUTE la session — la
      // barre d'onglets remonte et laisse une bande vide en bas.
      //
      // Principe retenu : le clavier ne fait jamais que RÉDUIRE innerHeight.
      // On n'accepte donc une valeur plus petite que sur rotation d'écran,
      // où le changement est légitime. Toute mesure plus grande est prise
      // immédiatement — l'affichage se répare tout seul.
      function setAppHeight(forcer) {
        var h = window.innerHeight;
        if (!h) return;
        var actuel = parseInt(
          document.documentElement.style.getPropertyValue('--app-height'),
          10
        ) || 0;
        if (forcer || h > actuel) {
          document.documentElement.style.setProperty('--app-height', h + 'px');
        }
      }

      setAppHeight(true);

      // Rotation : seul cas où une hauteur plus petite est légitime.
      window.addEventListener('orientationchange', function () {
        setTimeout(function () { setAppHeight(true); }, 300);
      });

      window.addEventListener('load', function () {
        setAppHeight();
        // En PWA standalone, l'affichage met un instant à se stabiliser :
        // une mesure prise trop tôt fige une hauteur trop courte.
        setTimeout(function () { setAppHeight(); }, 300);
        setTimeout(function () { setAppHeight(); }, 800);
      });

      // Retour au premier plan et restauration depuis le cache de navigation :
      // deux moments où la hauteur a pu changer sans qu'aucun événement de
      // redimensionnement ne soit émis.
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) setTimeout(function () { setAppHeight(); }, 100);
      });
      window.addEventListener('pageshow', function () {
        setTimeout(function () { setAppHeight(); }, 100);
      });

      // visualViewport suit les variations réelles (barre Safari qui se
      // rétracte, clavier). Les réductions sont ignorées par setAppHeight,
      // seules les remontées passent.
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
          setTimeout(function () { setAppHeight(); }, 100);
        });
      }
    </script>
    <script>
      // Force reload when new Service Worker is available
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
        navigator.serviceWorker.getRegistration().then(reg => {
          if (!reg) return;
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New version available — force reload
                newWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        });
      }
    </script>
    <!-- OneSignal Web Push — service worker enregistré sur un scope séparé
         (/push/onesignal/) pour ne jamais entrer en conflit avec le service
         worker de la PWA (celui-ci reste seul maître du scope racine /). -->
    <script>
      window.OneSignalReady = false;
      window.OneSignalError = null;
      
      // Log qu'on a commencé à charger
      console.log('Démarrage du chargement OneSignal SDK...');
      
      // Fallback timeout: si OneSignal ne charge pas en 8 sec, mark comme failed
      setTimeout(() => {
        if (!window.OneSignal) {
          window.OneSignalError = 'Timeout de chargement du SDK OneSignal (CDN bloqué ou lent)';
          console.warn('⚠️ OneSignal SDK timeout après 8 secondes');
          console.warn('Possible causes: bloqueur de contenu, CDN externe, réseau lent');
        }
      }, 8000);
    </script>
    <script 
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" 
      defer
      onerror="window.OneSignalError='Erreur de chargement du script OneSignal (CORS ou bloqué)'; console.error('❌ OneSignal CDN script failed to load');"
    ></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function (OneSignal) {
        try {
          console.log('OneSignal SDK chargé, initialisation...');
          await OneSignal.init({
            appId: 'f336f95a-cd06-42cf-9989-5aef9ccc1205',
            serviceWorkerPath: 'push/onesignal/OneSignalSDKWorker.js',
            serviceWorkerParam: { scope: '/push/onesignal/' },
          });
          window.OneSignalReady = true;
          console.log('✅ OneSignal initialisé avec succès');
        } catch (e) {
          window.OneSignalError = e.message;
          console.error('❌ Erreur initialisation OneSignal:', e);
        }
      });
      
      // Fallback: si le script CDN ne charge pas du tout
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (!window.OneSignal) {
            window.OneSignalError = window.OneSignalError || 'SDK OneSignal non chargé depuis le CDN';
            console.error('❌ OneSignal SDK n\'a pas pu charger du CDN');
            console.error('Possible causes: CORS, bloqueur de contenu, pas de réseau');
          }
        }, 500);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
